<style>
:root { --bg:#eef2f6; --card:#ffffff; --text:#1f2933; --muted:#5b6472; --border:#d7dde5; --accent:#2e6da4; --shadow:0 10px 30px rgba(15,30,50,.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f141b; --card:#1a222d; --text:#e6ebf1; --muted:#9aa6b4; --border:#2c3746; --accent:#6aa5dc; --shadow:0 10px 30px rgba(0,0,0,.5); } }
:root[data-theme="dark"] { --bg:#0f141b; --card:#1a222d; --text:#e6ebf1; --muted:#9aa6b4; --border:#2c3746; --accent:#6aa5dc; --shadow:0 10px 30px rgba(0,0,0,.5); }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family: DejaVu Sans, "Segoe UI", system-ui, Arial, sans-serif; }
main { max-width:1500px; margin:0 auto; padding:24px 16px 40px; }
.diagram { position:relative; background:#fff; border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.scroller { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.diagram svg { display:block; width:100%; height:auto; }
@media (max-width: 900px) { .diagram svg { min-width:1100px; } .hint-mobile { display:block; } }
.hint-mobile { display:none; color:var(--muted); font-size:13px; margin:0 4px 8px; }
.note { color:var(--muted); font-size:14px; margin:12px 4px 0; }
/* interaction */
.node { cursor:pointer; outline:none; }
.node .box { transition: stroke-width .15s, filter .15s, opacity .15s; }
.edge .line, .edge .elabel { transition: opacity .15s, stroke-width .15s; }
svg.focusing .node:not(.near):not(.frame), svg.focusing .edge:not(.lit) { opacity:.25; }
.node, .edge { transition: opacity .15s; }
.node.lit .box, .node:focus-visible .box { stroke-width:5; filter: drop-shadow(0 0 10px rgba(46,109,164,.55)); }
.frame.lit .box { stroke:#2e6da4; }
.edge.lit .line { stroke-width:5.5; }
.node.selected .box { stroke-width:6; }
/* infobox */
.info { position:absolute; z-index:5; width:min(380px, calc(100% - 24px)); background:var(--card); color:var(--text);
  border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px 12px; font-size:14.5px; line-height:1.45; }
.info[hidden] { display:none; }
.info-head { display:flex; align-items:flex-start; gap:10px; }
.info h2 { margin:0; font-size:17px; }
.info .sub { color:var(--muted); font-size:13px; margin-top:2px; }
.info .chip { margin-left:auto; flex:none; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; }
.chip.server { background:#e6eef8; color:#2e5f91; }
.chip.kunde { background:#eef0f3; color:#4b5563; }
.chip.nutzer { background:#e3f2e8; color:#2f6b42; }
.info ul { margin:10px 0 0; padding-left:18px; }
.info li { margin:4px 0; }
.info .tech { margin-top:10px; padding-top:8px; border-top:1px solid var(--border); }
.info .tech h3 { margin:0; font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
.info .tech ul { margin-top:6px; font-size:13.5px; color:var(--muted); }
.info .close { border:0; background:transparent; color:var(--muted); font-size:20px; line-height:1; cursor:pointer; padding:0 2px; }
@media (max-width: 700px) {
  .info { position:fixed; left:12px !important; right:12px; bottom:12px; top:auto !important; width:auto; max-height:55vh; overflow:auto; }
}
</style>
</head>

        <span class="chip" id="info-chip"></span><button class="close" id="info-close" aria-label="Schließen">×</button></div>
      <ul id="info-list"></ul>
      <div id="info-tech"></div>
    </div>
  </div>
  <p class="note">MABJA Solutions GmbH · Projekt „Serverraumüberwachung (Kamera &amp; Raspberry Pi)“ · Produkt Attentio. Bereiche überfahren zum Hervorheben, anklicken für Details.</p>
</main>
<script>
const INFO = {"cam1": {"sub": "Kamera beim Kunden", "items": ["Ganz normale Netzwerkkameras, wie sie in vielen Gebäuden schon hängen. Vorhandene Kameras können weiter genutzt werden.", "Jede Kamera schickt ihr Bild über das hauseigene Netzwerk an den Attentio-Server.", "Es können beliebig viele Kameras sein; neue werden automatisch erkannt."], "tech": ["IP-Kameras, Videostream per RTSP, H.264.", "Drehung und Bildgröße je Kamera im Dashboard einstellbar."]}, "cam2": {"sub": "Kamera beim Kunden", "items": ["Ganz normale Netzwerkkameras, wie sie in vielen Gebäuden schon hängen. Vorhandene Kameras können weiter genutzt werden.", "Jede Kamera schickt ihr Bild über das hauseigene Netzwerk an den Attentio-Server.", "Es können beliebig viele Kameras sein; neue werden automatisch erkannt."], "tech": ["IP-Kameras, Videostream per RTSP, H.264.", "Drehung und Bildgröße je Kamera im Dashboard einstellbar."]}, "camn": {"sub": "Kamera beim Kunden", "items": ["Ganz normale Netzwerkkameras, wie sie in vielen Gebäuden schon hängen. Vorhandene Kameras können weiter genutzt werden.", "Jede Kamera schickt ihr Bild über das hauseigene Netzwerk an den Attentio-Server.", "Es können beliebig viele Kameras sein; neue werden automatisch erkannt."], "tech": ["IP-Kameras, Videostream per RTSP, H.264.", "Drehung und Bildgröße je Kamera im Dashboard einstellbar."]}, "hub": {"sub": "Teil des Attentio-Servers", "items": ["Die Sammelstelle für alle Kamerabilder; jede Kamera hat ihren eigenen Kanal.", "Gibt die Bilder an die KI-Erkennung weiter und die markierten Bilder an das Dashboard.", "Nur berechtigte Geräte dürfen Bilder senden oder abholen."], "tech": ["Streaming-Server (MediaMTX) als Container.", "RTSP/WebRTC, Zugangsdaten je Rolle."]}, "ai": {"sub": "Teil des Attentio-Servers", "items": ["Künstliche Intelligenz erkennt in jedem Bild, wo Personen sind, und zeichnet einen Rahmen um sie.", "Sie folgt jeder Person durch das Bild, weiß aber nicht, wer sie ist.", "Daraus entstehen das markierte Livebild und die Anzahl der Personen je Kamera.", "Läuft direkt im Server auf einem eigenen KI-Chip; nichts geht ins Internet."], "tech": ["Personenerkennung (YOLO) auf einem Hailo-KI-Beschleuniger.", "Tracking (ByteTrack), ein eigener Prozess je Kamera.", "Mehrere Kameras parallel; fällt eine aus, laufen die anderen weiter."]}, "opcua": {"sub": "Teil des Attentio-Servers", "items": ["Meldet jede Sekunde für jede Kamera: Wie viele Personen sind zu sehen, läuft die Kamera, und wann war das?", "Dashboard und Protokoll holen sich die Zahlen von hier.", "Auch andere Systeme des Kunden, z. B. eine Gebäudeleittechnik, können diese Meldungen nutzen."], "tech": ["OPC-UA-Server (offener Industriestandard).", "Werte je Kamera: PersonCount, CameraConnected, Timestamp; 1 Hz."]}, "db": {"sub": "Teil des Attentio-Servers", "items": ["Schreibt die Zahlen laufend mit, damit man später nachsehen kann: Wann waren wie viele Personen da?", "Es werden keine Bilder gespeichert, nur Zahlen und Uhrzeiten.", "Wie lange die Einträge aufbewahrt werden, ist einstellbar."], "tech": ["Leichtgewichtige Datenbank, ein Eintrag je Kamera und Zeitpunkt.", "Felder: Zeitstempel, Anzahl Personen, Erkennung (ja/nein), Kamerastatus."]}, "dashboard": {"sub": "Teil des Attentio-Servers", "items": ["Die Bedienoberfläche, die man im Webbrowser öffnet, z. B. am PC im Leitstand oder auf dem Tablet.", "Zeigt alle Kameras auf einen Blick: läuft sie, wie viele Personen sind zu sehen, und das Livebild mit Markierungen.", "Warnt, wenn etwas auffällt, z. B. eine Person außerhalb der erlaubten Zeiten oder eine ausgefallene Kamera.", "Zeigt für jede Kamera den Verlauf aus dem Protokoll.", "Nur für angemeldete, berechtigte Personen."], "tech": ["Weboberfläche als Container; Anmeldung mit Rollen und Rechten.", "Liest die Meldestelle (OPC UA) und das Protokoll (Datenbank).", "Warnregeln und Kameraeinstellungen frei konfigurierbar."]}, "privacy": {"sub": "Datenschutz eingebaut", "items": ["Alles läuft beim Kunden vor Ort; keine Cloud, nichts verlässt das Gebäude.", "Kamerabilder werden nur kurz zur Auswertung verwendet und nie gespeichert.", "Das System erkennt, dass eine Person da ist, aber nicht, wer es ist.", "Gespeichert werden nur Zahlen, z. B. „3 Personen um 14:05 Uhr“.", "Einsehen dürfen das nur berechtigte Mitarbeiter."], "tech": ["Privacy by Design: Bilder nur im Arbeitsspeicher, keine Aufzeichnung, keine Wiedererkennung (Re-ID)."]}, "staff": {"sub": "Nutzer", "items": ["Zum Beispiel Sicherheits- oder Haustechnik-Personal mit Berechtigung.", "Öffnet das Dashboard im Browser, am Arbeitsplatz, im Leitstand oder unterwegs im Gebäude.", "Bekommt Warnungen sofort angezeigt und kann Einstellungen im Rahmen seiner Rechte ändern."]}, "network": {"sub": "Beim Kunden vor Ort", "items": ["Kameras, Server und Dashboard stehen alle beim Kunden im eigenen Netzwerk.", "Es wird keine Internetverbindung gebraucht; Bilder und Daten bleiben im Haus.", "Die Auswertung passiert dort, wo die Bilder entstehen."], "tech": ["Edge Computing: lokale KI-Auswertung ohne Cloud-Dienste."]}, "server": {"sub": "Herzstück des Systems", "items": ["Ein kleiner Rechner mit eingebautem KI-Chip, der beim Kunden steht.", "Er nimmt die Kamerabilder an, wertet sie aus und stellt die Ergebnisse dem Dashboard bereit.", "Jede Aufgabe läuft als eigener Baustein; so lässt sich das System leicht erweitern und warten."], "tech": ["Edge-Server mit KI-Beschleuniger; alle Dienste als Container."]}};
const TITLES = {"cam1": "Kamera 1", "cam2": "Kamera 2", "camn": "Weitere Kameras", "hub": "Bildverteiler", "ai": "KI-Erkennung", "opcua": "Meldestelle", "db": "Protokoll", "dashboard": "Dashboard", "privacy": "Datenschutz", "staff": "Personal", "network": "Beim Kunden vor Ort", "server": "Attentio-Server"};
const STATUS = {"cam1": "kunde", "cam2": "kunde", "camn": "kunde", "hub": "server", "ai": "server", "opcua": "server", "db": "server", "dashboard": "server", "privacy": "server", "staff": "nutzer", "network": "kunde", "server": "server"};
const CHIP = { kunde: 'Beim Kunden', server: 'Attentio-Server', nutzer: 'Nutzer' };
const svg = document.querySelector('#diagram svg');
const diagram = document.getElementById('diagram');
const box = document.getElementById('info');
const edges = [...svg.querySelectorAll('.edge')];
const nodes = [...svg.querySelectorAll('.node')];
let selected = null;

function light(id) {
  // Hovered element highlighted, its direct neighbours and connections kept
  // visible, everything else dimmed. The network frame highlights alone.
  svg.classList.toggle('focusing', Boolean(id) && id !== 'network' && id !== 'server');
  const near = new Set([id]);
  for (const e of edges) {
    const on = Boolean(id) && (e.dataset.a === id || e.dataset.b === id);
    e.classList.toggle('lit', on);
    if (on) { near.add(e.dataset.a); near.add(e.dataset.b); }
  }
  for (const n of nodes) {
    n.classList.toggle('lit', n.dataset.id === id);
    n.classList.toggle('near', near.has(n.dataset.id));
  }
}

function open(id, clientX, clientY) {
  const d = INFO[id];
  if (!d) return;
  selected = id;
  for (const n of nodes) n.classList.toggle('selected', n.dataset.id === id);
  document.getElementById('info-title').textContent = TITLES[id];
  document.getElementById('info-sub').textContent = d.sub;
  const chip = document.getElementById('info-chip');
  chip.textContent = CHIP[STATUS[id]];
  chip.className = 'chip ' + STATUS[id];
  document.getElementById('info-list').replaceChildren(...d.items.map((t) => {
    const li = document.createElement('li'); li.textContent = t; return li;
  }));
  const tech = document.getElementById('info-tech');
  tech.replaceChildren();
  if (d.tech) {
    const wrap = document.createElement('div'); wrap.className = 'tech';
    const head = document.createElement('h3'); head.textContent = 'Technische Details';
    const ul = document.createElement('ul');
    ul.append(...d.tech.map((t) => { const li = document.createElement('li'); li.textContent = t; return li; }));
    wrap.append(head, ul); tech.append(wrap);
  }
  box.hidden = false;
  const r = diagram.getBoundingClientRect();
  const bw = box.offsetWidth, bh = box.offsetHeight;
  let x = clientX - r.left + 16, y = clientY - r.top + 16;
  if (x + bw > r.width - 8) x = Math.max(8, clientX - r.left - bw - 16);
  if (x < 8) x = 8;
  if (y + bh > r.height - 8) y = Math.max(8, r.height - bh - 8);
  box.style.left = x + 'px';
  box.style.top = y + 'px';
  light(id);
}

function close() {
  box.hidden = true;
  selected = null;
  for (const n of nodes) n.classList.remove('selected');
  light(null);
}

for (const n of nodes) {
  n.addEventListener('mouseenter', () => { if (!selected) light(n.dataset.id); });
  n.addEventListener('mouseleave', () => { if (!selected) light(null); });
  n.addEventListener('click', (ev) => { ev.stopPropagation(); if (selected) { close(); return; } open(n.dataset.id, ev.clientX, ev.clientY); });
  n.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    const b = n.getBoundingClientRect();
    open(n.dataset.id, b.left + b.width / 2, b.top + b.height / 2);
  });
  n.addEventListener('focus', () => { if (!selected) light(n.dataset.id); });
  n.addEventListener('blur', () => { if (!selected) light(null); });
}
for (const e of edges) {
  e.addEventListener('mouseenter', () => { if (!selected) light(e.dataset.a); });
  e.addEventListener('mouseleave', () => { if (!selected) light(null); });
}
document.getElementById('info-close').addEventListener('click', close);
box.addEventListener('click', (ev) => ev.stopPropagation());
document.addEventListener('click', close);
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') close(); });
</script>
</body>
</html>
