<style>
:root { --bg:#eef2f6; --card:#ffffff; --text:#1f2933; --muted:#5b6472; --border:#d7dde5; --accent:#2e6da4; --shadow:0 10px 30px rgba(15,30,50,.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f141b; --card:#1a222d; --text:#e6ebf1; --muted:#9aa6b4; --border:#2c3746; --accent:#6aa5dc; --shadow:0 10px 30px rgba(0,0,0,.5); } }
:root[data-theme="dark"] { --bg:#0f141b; --card:#1a222d; --text:#e6ebf1; --muted:#9aa6b4; --border:#2c3746; --accent:#6aa5dc; --shadow:0 10px 30px rgba(0,0,0,.5); }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family: DejaVu Sans, "Segoe UI", system-ui, Arial, sans-serif; }
main { max-width:1500px; margin:0 auto; padding:24px 16px 40px; }
.diagram { position:relative; background:#fff; border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.scroller { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.diagram svg { display:block; width:100%; height:auto; }
@media (max-width: 900px) { .diagram svg { min-width:1100px; } .hint-mobile { display:block; } }
.hint-mobile { display:none; color:var(--muted); font-size:13px; margin:0 4px 8px; }
.note { color:var(--muted); font-size:14px; margin:12px 4px 0; }
/* interaction */
.node { cursor:pointer; outline:none; }
.node .box { transition: stroke-width .15s, filter .15s, opacity .15s; }
.edge .line, .edge .elabel { transition: opacity .15s, stroke-width .15s; }
svg.focusing .node:not(.near):not(.frame), svg.focusing .edge:not(.lit) { opacity:.25; }
.node, .edge { transition: opacity .15s; }
.node.lit .box, .node:focus-visible .box { stroke-width:5; filter: drop-shadow(0 0 10px rgba(46,109,164,.55)); }
.frame.lit .box { stroke:#2e6da4; }
.edge.lit .line { stroke-width:5.5; }
.node.selected .box { stroke-width:6; }
/* infobox */
.info { position:absolute; z-index:5; width:min(380px, calc(100% - 24px)); background:var(--card); color:var(--text);
  border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px 12px; font-size:14.5px; line-height:1.45; }
.info[hidden] { display:none; }
.info-head { display:flex; align-items:flex-start; gap:10px; }
.info h2 { margin:0; font-size:17px; }
.info .sub { color:var(--muted); font-size:13px; margin-top:2px; }
.info .chip { margin-left:auto; flex:none; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; }
.chip.aktiv { background:#e3f2e8; color:#2f6b42; }
.chip.geplant, .chip.vorgesehen { background:#fff1db; color:#8a5a12; }
.chip.planung { background:#e6eef8; color:#2e5f91; }
.info ul { margin:10px 0 0; padding-left:18px; }
.info li { margin:4px 0; }
.info .close { border:0; background:transparent; color:var(--muted); font-size:20px; line-height:1; cursor:pointer; padding:0 2px; }
@media (max-width: 700px) {
  .info { position:fixed; left:12px !important; right:12px; bottom:12px; top:auto !important; width:auto; max-height:55vh; overflow:auto; }
}
</style>
</head>

</main>
<script>
const INFO = {"k_sensor": {"sub": "Erfassung vor Ort", "items": ["Kamera direkt am Pi 5 im Serverraum (CSI-Kameramodul oder USB-Kamera).", "Der Pi 5 hat keinen Hardware-Encoder: H.264 entsteht per Software (x264, ultrafast/zerolatency) oder kommt fertig von einer USB-Kamera mit H.264-Ausgabe.", "Sendet per RTSP an MediaMTX auf demselben Gerät (cams/<id>/source).", "Für die Zählung reichen 15 fps bei 720p; das halbiert die Dekodierlast gegenüber 30 fps."]}, "k_net": {"sub": "Weitere Kameras", "items": ["Jede Kamera sendet an ihren eigenen Pfad cams/<id>/source (RTSP über TCP, Port 8554); die Hauptkamera nutzt /source (ID „main“).", "Neue Kameras werden ohne Konfigurationsänderung erkannt und innerhalb von ~2 s verarbeitet; bis zu 4 gleichzeitig.", "Pro Kamera-ID sendet immer nur ein Gerät.", "Empfohlen: Bitratenbegrenzung und ein Keyframe pro Sekunde (-g 30)."]}, "k_browser": {"sub": "„Kamera senden“", "items": ["Ein Smartphone oder Notebook schickt seine Kamera direkt aus dem Browser, über das Dashboard (HTTPS).", "Übertragung per WebRTC (WHIP). Die Zugangsdaten bleiben auf dem Server.", "Die Kamera wird automatisch im Dashboard eingetragen.", "Browser pausieren die Kamera, wenn die Seite im Hintergrund ist oder der Bildschirm ausgeht."]}, "mediamtx": {"sub": "Video-Drehscheibe", "items": ["Nimmt alle Kamerastreams an und verteilt sie: an den Tracker, an das Dashboard und an Videoplayer (z. B. VLC).", "RTSP: Port 8554 (TCP). WebRTC: Port 8189 (UDP/TCP); Verbindungsaufbau (WHIP) nur lokal über das Dashboard.", "Eigene Zugangsdaten je Rolle: Kameras dürfen nur …/source senden, der Tracker nur …/annotated.", "Ohne VPN neu zu regeln: wer im Schulnetz die Streams ansehen darf."]}, "proc_cam": {"sub": "Tracker · Bildverarbeitung", "items": ["Ein eigener Prozess je Kamera: Dekodieren, Drehen und Skalieren (je Kamera einstellbar), Vorbereitung für das KI-Modell, Zeichnen der Boxen mit IDs, H.264-Kodierung des annotierten Streams.", "Schreibt je Kamera den aktuellen Stand (Anzahl, verbunden, Zeit) für den OPC-UA-Server.", "Stürzt ein Prozess ab, betrifft das nur diese Kamera; sie startet nach 10 s neu.", "Ohne Kamera wartet der Tracker sparsam (~30 MB) und lädt das Modell erst bei Bedarf."]}, "proc_main": {"sub": "Tracker · KI-Inferenz", "items": ["Besitzt als einziger Prozess den Hailo-8L (13 TOPS) und führt die Personenerkennung (YOLOv5s) für alle Kameras aus.", "ByteTrack vergibt stabile IDs je Kamera; 1 s Haltezeit gegen Flackern bei kurzen Verdeckungen.", "Bildübergabe über gemeinsamen Speicher, Ergebnis zurück per Pipe.", "Gemessen: ~64 Erkennungen/s gesamt; mit 3 Kameras je ~19 fps bei ~65 ms Verarbeitungszeit."]}, "dashboard": {"sub": "Weboberfläche", "items": ["In Betrieb: Übersicht aller Kameras mit Status, Personenzahl und Live-Bild; Einstellungen (Kameras, Drehung, Ausgabehöhe, Vorschau); automatische Kameraerkennung; „Kamera senden“.", "Liest den Status direkt per OPC UA (1 Hz); Live-Bilder entstehen nur, solange jemand zusieht.", "HTTP auf Port 8088, HTTPS auf 8443 (nötig für „Kamera senden“).", "Geplant: Verlauf & Statistik aus der Datenbank (Z2), Abgleich befugter/unbefugter Zutritte (Z3).", "Ohne VPN nötig: Anmeldung bzw. Zugriffsbeschränkung im Schulnetz."]}, "opcua_srv": {"sub": "Schnittstelle für Metadaten", "items": ["opc.tcp://<Pi>:4840/camera-tracker/, Namespace urn:camera-tracker.", "Je Kamera: Cameras.<id>.PersonCount, .CameraConnected, .Timestamp; die Hauptkamera zusätzlich unter PeopleTracking.*.", "Aktualisierung 1 Hz; nur der aktuelle Stand, keine Historie. Die Datenbank ist das Protokoll.", "CameraConnected = false bedeutet „nicht beobachtet“, nicht „niemand da“."]}, "opcua_client": {"sub": "Datenerfassung (Ziel Z2)", "items": ["Liest die Metadaten aller Kameras einmal pro Sekunde vom OPC-UA-Server.", "Läuft künftig auf demselben Pi wie alle anderen Dienste.", "Ersetzt den bisher geplanten Abruf über das VPN vom zweiten Pi."]}, "db": {"sub": "Protokoll (Ziel Z2)", "items": ["Speichert je Kamera: Zeitstempel, Anzahl Personen, Erkennung (ja/nein), Kamerastatus.", "Nur anonyme Zahlen, keine Bilder.", "Grundlage für Verlauf, Statistik und den Abgleich befugter/unbefugter Zutritte (Z3)."]}, "privacy": {"sub": "Privacy by Design", "items": ["Videobilder liegen nur im Arbeitsspeicher; es wird nichts aufgezeichnet.", "Keine Identifizierung von Personen (keine Wiedererkennung); gespeichert werden nur anonyme Metadaten.", "Alles bleibt im Schulnetz; es gibt keinen Dienst außerhalb.", "Mit dem Wegfall des VPN neu festzulegen: wer im Schulnetz auf Dashboard und Streams zugreifen darf. Mit der/dem Datenschutzbeauftragten der Schule abstimmen."]}, "staff": {"sub": "Nutzer", "items": ["Öffnet das Dashboard im Browser, am Leitstand oder mobil im Schulnetz.", "Sieht auf einen Blick: Person erkannt? Kamera funktionsfähig? Live-Bild mit Markierungen."]}, "network": {"sub": "Planungsstand 12.11.2026", "items": ["Neu: Die Schule stellt einen Raspberry Pi 5 mit Hailo AI HAT+ bereit; das ganze System läuft lokal auf diesem einen Gerät.", "Entfällt: Tailscale-VPN und der entfernte Analyse-Pi.", "Keine Verbindungen ins Internet und keine von außen erreichbaren Dienste.", "Wird angepasst, sobald die Ausstattung verbindlich zugesagt ist."]}};
const TITLES = {"k_sensor": "Kamerasensor am Pi", "k_net": "Weitere Kameras", "k_browser": "Browser-Kamera", "mediamtx": "MediaMTX", "proc_cam": "Kameraprozesse", "proc_main": "Hauptprozess", "dashboard": "Dashboard", "opcua_srv": "OPC-UA-Server", "opcua_client": "OPC-UA-Client", "db": "Datenbank", "privacy": "Datenschutz durch Technik", "staff": "Sicherheitspersonal", "network": "Schulnetz (lokal)"};
const STATUS = {"k_sensor": "vorgesehen", "k_net": "aktiv", "k_browser": "aktiv", "mediamtx": "aktiv", "proc_cam": "aktiv", "proc_main": "aktiv", "dashboard": "aktiv", "opcua_srv": "aktiv", "opcua_client": "geplant", "db": "geplant", "privacy": "aktiv", "staff": "aktiv", "network": "planung"};
const CHIP = { aktiv: 'in Betrieb', geplant: 'geplant', vorgesehen: 'vorgesehen', planung: 'Planungsstand' };
const svg = document.querySelector('#diagram svg');
const diagram = document.getElementById('diagram');
const box = document.getElementById('info');
const edges = [...svg.querySelectorAll('.edge')];
const nodes = [...svg.querySelectorAll('.node')];
let selected = null;

function light(id) {
  // Hovered element highlighted, its direct neighbours and connections kept
  // visible, everything else dimmed. The network frame highlights alone.
  svg.classList.toggle('focusing', Boolean(id) && id !== 'network');
  const near = new Set([id]);
  for (const e of edges) {
    const on = Boolean(id) && (e.dataset.a === id || e.dataset.b === id);
    e.classList.toggle('lit', on);
    if (on) { near.add(e.dataset.a); near.add(e.dataset.b); }
  }
  for (const n of nodes) {
    n.classList.toggle('lit', n.dataset.id === id);
    n.classList.toggle('near', near.has(n.dataset.id));
  }
}

function open(id, clientX, clientY) {
  const d = INFO[id];
  if (!d) return;
  selected = id;
  for (const n of nodes) n.classList.toggle('selected', n.dataset.id === id);
  document.getElementById('info-title').textContent = TITLES[id];
  document.getElementById('info-sub').textContent = d.sub;
  const chip = document.getElementById('info-chip');
  chip.textContent = CHIP[STATUS[id]];
  chip.className = 'chip ' + STATUS[id];
  document.getElementById('info-list').replaceChildren(...d.items.map((t) => {
    const li = document.createElement('li'); li.textContent = t; return li;
  }));
  box.hidden = false;
  const r = diagram.getBoundingClientRect();
  const bw = box.offsetWidth, bh = box.offsetHeight;
  let x = clientX - r.left + 16, y = clientY - r.top + 16;
  if (x + bw > r.width - 8) x = Math.max(8, clientX - r.left - bw - 16);
  if (x < 8) x = 8;
  if (y + bh > r.height - 8) y = Math.max(8, r.height - bh - 8);
  box.style.left = x + 'px';
  box.style.top = y + 'px';
  light(id);
}

function close() {
  box.hidden = true;
  selected = null;
  for (const n of nodes) n.classList.remove('selected');
  light(null);
}

for (const n of nodes) {
  n.addEventListener('mouseenter', () => { if (!selected) light(n.dataset.id); });
  n.addEventListener('mouseleave', () => { if (!selected) light(null); });
  n.addEventListener('click', (ev) => { ev.stopPropagation(); open(n.dataset.id, ev.clientX, ev.clientY); });
  n.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    const b = n.getBoundingClientRect();
    open(n.dataset.id, b.left + b.width / 2, b.top + b.height / 2);
  });
  n.addEventListener('focus', () => { if (!selected) light(n.dataset.id); });
  n.addEventListener('blur', () => { if (!selected) light(null); });
}
for (const e of edges) {
  e.addEventListener('mouseenter', () => { if (!selected) light(e.dataset.a); });
  e.addEventListener('mouseleave', () => { if (!selected) light(null); });
}
document.getElementById('info-close').addEventListener('click', close);
box.addEventListener('click', (ev) => ev.stopPropagation());
document.addEventListener('click', close);
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') close(); });
</script>
